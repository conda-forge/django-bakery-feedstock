{% set name = "django-bakery" %}
{% set version = "0.14.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/django_bakery-{{ version }}.tar.gz
  sha256: ae4c5abeeba15a8156365f005f4c63a691cdd8cceb142c4c912926f1936657f4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools-scm
    - pip
    - setuptools
  run:
    - botocore >=1.4.4
    - fsspec >=2026.7.0
    - python >={{ python_min }}
    - django >=5.2,<6.2
    - six >1.5.2
    - boto3 >=1.4.4
    - fs >=2.0.17

test:
  imports:
    - bakery
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://www.github.com/palewire/django-bakery/
  license: MIT
  license_family: MIT
  license_file: '{{ environ["RECIPE_DIR"] }}/LICENSE'
  summary: 'A set of helpers for baking your Django site out as flat files'
  description: |
    A set of helpers for baking your Django site out as flat files
  doc_url: https://django-bakery.readthedocs.io/en/latest/
  dev_url: https://github.com/datadesk/django-bakery

extra:
  recipe-maintainers:
    - cshaley
    - rxm7706
    - sannykr
